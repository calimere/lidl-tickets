# Production derrière Nginx Proxy Manager (NPM) :
#   cp .env.example .env   (remplir)
#   docker compose up -d --build
#   puis rattacher NPM au réseau « lidl-tickets-net » (voir README) et créer le Proxy Host
#   lidl-tickets.csk-prod.fr -> http://lidl-tickets:3006
#
# Aucun port n'est publié sur l'hôte : le portail n'est joignable que depuis le réseau
# Docker dédié ci-dessous, où NPM sert de passerelle (HTTPS, certificat, domaine).

services:
  app:
    build: .
    container_name: lidl-tickets
    restart: unless-stopped
    environment:
      LIDL_SECRET_KEY: ${LIDL_SECRET_KEY:?Définissez LIDL_SECRET_KEY dans .env}
      LIDL_REGISTRATION_CODE: ${LIDL_REGISTRATION_CODE:-}
      LIDL_COOKIE_SECURE: ${LIDL_COOKIE_SECURE:-1}
      LIDL_COUNTRY: ${LIDL_COUNTRY:-FR}
      LIDL_LANGUAGE: ${LIDL_LANGUAGE:-fr}
      LIDL_PUBLISHER: ${LIDL_PUBLISHER:-}
      LIDL_CONTACT_EMAIL: ${LIDL_CONTACT_EMAIL:-}
      LIDL_DEMO_TTL_HOURS: ${LIDL_DEMO_TTL_HOURS:-24}
      LIDL_USE_SYSTEM_CA: ${LIDL_USE_SYSTEM_CA:-0}
    volumes:
      - lidl-data:/data
    networks:
      - lidl-tickets-net
    # volontairement pas de « ports: »

networks:
  # Réseau dédié au portail. Nom fixe pour pouvoir y rattacher NPM.
  lidl-tickets-net:
    name: lidl-tickets-net

volumes:
  lidl-data:
